name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/pos/package.json
          package-manager-cache: false
      # rxdb-premium's installer echoes its access token, so the output is filtered.
      # Its postinstall reads the licence from RXDB_PREMIUM (a repository secret); fork PRs get none.
      - name: Install (token lines filtered)
        run: |
          set -o pipefail
          { pnpm install --frozen-lockfile; } 2>&1 | { grep -vi accessToken || true; }
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - name: "Guard: pnpm side-effects cache is off"
        run: |
          value="$(pnpm config get side-effects-cache)"
          if [ "$value" != "false" ]; then
            echo "::error::pnpm side-effects cache must be false, got: $value"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
