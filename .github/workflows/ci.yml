name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/pos/package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: "Guard: pnpm side-effects cache is off"
        run: |
          value="$(pnpm config get side-effects-cache)"
          if [ "$value" != "false" ]; then
            echo "::error::pnpm side-effects cache must be false, got: $value"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
